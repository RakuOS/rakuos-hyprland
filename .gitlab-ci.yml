  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: always
    - if: '$CI_COMMIT_BRANCH == "staging"'
      when: always
    - if: '$CI_COMMIT_BRANCH == "rakuosel"'
      when: always
    - if: '$CI_COMMIT_BRANCH == "rawhide"'
      when: always
    - if: '$CI_COMMIT_BRANCH == "rakuosel"'
