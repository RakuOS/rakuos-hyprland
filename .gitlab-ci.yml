      artifacts: false

push-tags-base:
  stage: push
  image: quay.io/buildah/stable:latest
  tags:
    - saas-linux-2xlarge-amd64
  needs:
    - job: test-image-standard
      artifacts: false
    - job: test-image-nvidia
      artifacts: false
  script:
    - |
      set -euo pipefail
      dnf install -y --quiet jq
      case "${CI_COMMIT_BRANCH}" in
        "${CI_DEFAULT_BRANCH}") BRANCH_SLUG="${DEFAULT_TAG}" ;;
        "staging")              BRANCH_SLUG="staging"        ;;
        "rawhide")              BRANCH_SLUG="rawhide"        ;;
        "rakuosel")             BRANCH_SLUG="rakuosel"       ;;
        *)                      BRANCH_SLUG="$(printf '%s' "${CI_COMMIT_BRANCH}" | tr '[:upper:]' '[:lower:]' | sed 's#[^a-z0-9._-]#-#g')" ;;
      esac
      DATE_TAG="$(date -u +%Y%m%d)"
      TEMP_TAG="${IMAGE_REGISTRY_QUAY}:ci-temp-${CI_PIPELINE_ID}"
      buildah login -u "${QUAY_USER}" -p "${QUAY_TOKEN}" quay.io
      buildah pull "docker://${TEMP_TAG}"
      if [ "${CI_COMMIT_BRANCH}" = "${CI_DEFAULT_BRANCH}" ]; then
        PRIMARY_TAG="${IMAGE_REGISTRY_QUAY}:${DEFAULT_TAG}"
        ALIAS_TAGS="${DEFAULT_TAG}.${DATE_TAG} ${DATE_TAG}"
      else
        PRIMARY_TAG="${IMAGE_REGISTRY_QUAY}:${BRANCH_SLUG}"
        ALIAS_TAGS="${BRANCH_SLUG}.${DATE_TAG}"
      fi
      echo "Pushing ${PRIMARY_TAG}..."
      buildah push --compression-format zstd:chunked "${TEMP_TAG}" "docker://${PRIMARY_TAG}"
      REPO_PATH="${IMAGE_REGISTRY_QUAY#quay.io/}"
      PRIMARY_TAG_NAME="${PRIMARY_TAG##*:}"
      DIGEST=$(curl -sf \
        -H "Authorization: Bearer ${QUAY_API_TOKEN}" \
        "https://quay.io/api/v1/repository/${REPO_PATH}/tag/?specificTag=${PRIMARY_TAG_NAME}&limit=1" \
        | jq -r '.tags[0].manifest_digest')
      echo "Manifest digest: ${DIGEST}"
      for alias in ${ALIAS_TAGS}; do
        echo "Aliasing :${alias} → ${DIGEST}..."
        curl -sf -X PUT \
          -H "Authorization: Bearer ${QUAY_API_TOKEN}" \
          -H "Content-Type: application/json" \
          -d "{\"manifest_digest\": \"${DIGEST}\"}" \
          "https://quay.io/api/v1/repository/${REPO_PATH}/tag/${alias}"
      done
      echo "All tags pushed and aliased."
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_BRANCH == "staging"'
    - if: '$CI_COMMIT_BRANCH == "rawhide"'
    - if: '$CI_COMMIT_BRANCH == "rakuosel"'

