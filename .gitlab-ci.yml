# ============================================================
# RPM DB Stress Tests + Immediate Failure Response
# ============================================================
# Requires group CI/CD variables:
#   TRIGGER_TOKEN_SELF  — pipeline trigger token for this project
#   GITLAB_API_TOKEN    — api-scoped token for pipeline cancellation

.image-test-job:
  image: quay.io/buildah/stable:latest
  tags:
    - saas-linux-2xlarge-amd64
  timeout: 3 hours
  variables:
    STORAGE_DRIVER: overlay
    BUILDAH_FORMAT: oci
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_BRANCH == "staging"'
    - if: '$CI_COMMIT_BRANCH == "rawhide"'
    - if: '$CI_COMMIT_BRANCH == "rakuosel"'

test-image-standard:
  extends: .image-test-job
  stage: test-iso
  needs:
    - job: build-base
      artifacts: false
  script:
    - |
      set -euo pipefail
      IMAGE_REF="${IMAGE_REGISTRY_QUAY}:ci-temp-${CI_PIPELINE_ID}"
      buildah login -u "${QUAY_USER}" -p "${QUAY_TOKEN}" quay.io
      buildah pull "docker://${IMAGE_REF}"
      CTR=$(buildah from "${IMAGE_REF}")

      echo "=== RPM DB stress test: Justfile + Anaconda packages ==="
      buildah run --isolation chroot --network host "${CTR}" -- \
        rum install -y --allowerasing \
          --enable-repo=fedora-cisco-openh264 \
          dracut-live livesys-scripts fuse-overlayfs \
          anaconda-live libblockdev-btrfs libblockdev-lvm libblockdev-dm \
          qrencode yad

      echo "=== RPM DB stress test: packages-live.list ==="
      buildah run --isolation chroot --network host "${CTR}" -- \
        bash -c 'grep -v "^\s*#" /usr/share/rakuos/packages-live.list | grep -v "^\s*$" | sed "s/\s*#.*//" | tr -s " \t" "\n" | grep -v "^$" | xargs rum install -y'

      buildah rm "${CTR}" || true
      echo "RPM DB stress test passed."

