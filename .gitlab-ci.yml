    - |
      if [ "${CI_PIPELINE_SOURCE}" != "merge_request_event" ]; then
        buildah login -u "${QUAY_USER}" -p "${QUAY_TOKEN}" quay.io
        echo "Pushing temporary image ${TEMP_TAG}..."
        buildah push --compression-format zstd:chunked "${TEMP_TAG}" "docker://${TEMP_TAG}"
      fi
  artifacts:
    reports:
      dotenv: build-nvidia.env
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_BRANCH == "staging"'
    - if: '$CI_COMMIT_BRANCH == "rawhide"'
    - if: '$CI_COMMIT_BRANCH == "rakuosel"'

.trigger-on-build-fail:
  stage: build
  image: quay.io/fedora/fedora:latest
  tags:
    - saas-linux-2xlarge-amd64
  allow_failure: true
  script:
    - |
      set -euo pipefail
      dnf5 install -y curl jq
      echo "Cleaning up Quay temp tags for pipeline ${CI_PIPELINE_ID}..."
      TEMP_TAG_NAME="ci-temp-${CI_PIPELINE_ID}"
      curl -sf -X DELETE \
        -H "Authorization: Bearer ${QUAY_API_TOKEN}" \
        "https://quay.io/api/v1/repository/${IMAGE_REGISTRY_QUAY#quay.io/}/tag/${TEMP_TAG_NAME}" || true
      curl -sf -X DELETE \
        -H "Authorization: Bearer ${QUAY_API_TOKEN}" \
        "https://quay.io/api/v1/repository/${IMAGE_REGISTRY_QUAY_NVIDIA#quay.io/}/tag/${TEMP_TAG_NAME}" || true
      echo "Temp tag cleanup complete."
      cancel_sibling() {
        local proj_id="$1"
        local proj_name="$2"
        if [ "${proj_id}" = "${CI_PROJECT_ID}" ]; then
          return 0
        fi
        for STATUS in running pending; do
          PIDS=$(curl -sf \
            --header "PRIVATE-TOKEN: ${GITLAB_API_TOKEN}" \
            "https://gitlab.com/api/v4/projects/${proj_id}/pipelines?ref=${CI_COMMIT_BRANCH}&status=${STATUS}&per_page=5" \
            | grep -o '"id":[0-9]*' | grep -o '[0-9]*' || true)
          for PID in ${PIDS}; do
            echo "Cancelling ${proj_name} pipeline ${PID} (${STATUS}) on ${CI_COMMIT_BRANCH}..."
            curl -sf -X POST \
              --header "PRIVATE-TOKEN: ${GITLAB_API_TOKEN}" \
              "https://gitlab.com/api/v4/projects/${proj_id}/pipelines/${PID}/cancel" || true
          done
        done
      }
      cancel_sibling "${GNOME_PROJECT_ID}"  "rakuos-gnome"
      cancel_sibling "${KDE_PROJECT_ID}"    "rakuos-kde"
      cancel_sibling "${COSMIC_PROJECT_ID}" "rakuos-cosmic"
      CUTOFF="$(date -u -d '20 minutes ago' +%Y-%m-%dT%H:%M:%SZ)"
      RECENT=$(curl -sf \
        --header "PRIVATE-TOKEN: ${GITLAB_API_TOKEN}" \
        "https://gitlab.com/api/v4/projects/${BASE_PROJECT_ID}/pipelines?ref=${CI_COMMIT_BRANCH}&updated_after=${CUTOFF}&per_page=5" \
        | jq 'length')
      if [ "${RECENT}" -gt 0 ]; then
        echo "Base rebuild already triggered recently (${RECENT} pipeline(s)). Skipping."
      else
        echo "Triggering base rebuild on rakuos-base/${CI_COMMIT_BRANCH}..."
        curl -sf -X POST \
          --form "token=${TRIGGER_TOKEN_BASE}" \
          --form "ref=${CI_COMMIT_BRANCH}" \
          "https://gitlab.com/api/v4/projects/${BASE_PROJECT_ID}/trigger/pipeline"
        echo "Base rebuild triggered."
      fi
      echo "Cancelling own pipeline ${CI_PIPELINE_ID}..."
      curl -sf -X POST \
        --header "PRIVATE-TOKEN: ${GITLAB_API_TOKEN}" \
        "https://gitlab.com/api/v4/projects/${CI_PROJECT_ID}/pipelines/${CI_PIPELINE_ID}/cancel" || true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: on_failure
    - if: '$CI_COMMIT_BRANCH == "staging"'
      when: on_failure
    - if: '$CI_COMMIT_BRANCH == "rawhide"'
      when: on_failure
    - if: '$CI_COMMIT_BRANCH == "rakuosel"'
      when: on_failure

trigger-on-base-build-fail:
