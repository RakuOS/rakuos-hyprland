# ============================================================
# RakuOS GNOME Image — GitLab CI/CD Pipeline
# ============================================================

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "trigger"'
    - if: '$CI_PIPELINE_SOURCE == "pipeline"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - when: never

variables:
  IMAGE_REGISTRY: "registry.gitlab.com/rakuos/images/rakuos-niri"
  IMAGE_REGISTRY_NVIDIA: "registry.gitlab.com/rakuos/images/rakuos-niri/nvidia"
  IMAGE_REGISTRY_QUAY: "quay.io/rakuos/rakuos-niri"
  IMAGE_REGISTRY_QUAY_NVIDIA: "quay.io/rakuos/rakuos-niri-nvidia"
  IMAGE_REGISTRY_QUAY_V4: "quay.io/rakuos/rakuos-niri-v4"
  IMAGE_REGISTRY_QUAY_NVIDIA_V4: "quay.io/rakuos/rakuos-niri-nvidia-v4"
  IMAGE_REGISTRY_QUAY_V3: "quay.io/rakuos/rakuos-niri-v3"
  IMAGE_REGISTRY_QUAY_NVIDIA_V3: "quay.io/rakuos/rakuos-niri-nvidia-v3"
  BASE_IMAGE_REPO_V4: "quay.io/rakuos/rakuos-base-v4"
  BASE_IMAGE_REPO_NVIDIA_V4: "quay.io/rakuos/rakuos-base-nvidia-v4"
  BASE_IMAGE_REPO_V3: "quay.io/rakuos/rakuos-base-v3"
  BASE_IMAGE_REPO_NVIDIA_V3: "quay.io/rakuos/rakuos-base-nvidia-v3"
  DEFAULT_TAG: "latest"
  IMAGE_DESC: "RakuOS Niri"
  IMAGE_KEYWORDS: "bootc,fedora,atomic,niri"

stages:
  - build
  - test-iso
  - push
  - sign
  - cleanup
  - dispatch

.buildah-job:
  image: quay.io/buildah/stable:latest
  tags:
    - saas-linux-2xlarge-amd64
  before_script:
    - |
      case "${CI_COMMIT_BRANCH}" in
        "${CI_DEFAULT_BRANCH}")
          export BRANCH_SLUG="${DEFAULT_TAG}"
          ;;
        "staging")
          export BRANCH_SLUG="staging"
          ;;
        "rawhide")
          export BRANCH_SLUG="rawhide"
          ;;
        "rakuosel")
          export BRANCH_SLUG="rakuosel"
          ;;
        *)
          export BRANCH_SLUG="$(printf '%s' "${CI_COMMIT_BRANCH}" | tr '[:upper:]' '[:lower:]' | sed 's#[^a-z0-9._-]#-#g')"
          ;;
      esac
      export BASE_IMAGE_TAG="${BRANCH_SLUG}"
      # Passed to build.sh as RAKUOS_STAGING via --build-arg so it
      # installs the rakuos-release-<de>-staging variant on staging.
      if [ "${CI_COMMIT_BRANCH}" = "staging" ]; then
        export RAKUOS_STAGING="1"
      else
        export RAKUOS_STAGING="0"
      fi
      echo "Using branch slug: ${BRANCH_SLUG}"
      echo "RAKUOS_STAGING=${RAKUOS_STAGING}"
      echo "Pulling base image tag: ${BASE_IMAGE_TAG}"
    - export DATE_TAG="$(date -u +%Y%m%d)"
  variables:
    STORAGE_DRIVER: overlay
    BUILDAH_FORMAT: oci

build-base:
  extends: .buildah-job
  stage: build
  script:
    - |
      if [ "${CI_COMMIT_BRANCH}" = "${CI_DEFAULT_BRANCH}" ]; then
        TAGS="${IMAGE_REGISTRY}:${DEFAULT_TAG} ${IMAGE_REGISTRY}:${DEFAULT_TAG}.${DATE_TAG} ${IMAGE_REGISTRY}:${DATE_TAG}"
      else
        TAGS="${IMAGE_REGISTRY}:${BRANCH_SLUG} ${IMAGE_REGISTRY}:${BRANCH_SLUG}.${DATE_TAG}"
      fi
      export TAGS BRANCH_SLUG
      printf 'TAGS=%s\nBRANCH_SLUG=%s\n' "${TAGS}" "${BRANCH_SLUG}" > build-base.env

    - export TEMP_TAG="${IMAGE_REGISTRY_QUAY}:ci-temp-${CI_PIPELINE_ID}"

    - |
      buildah build \
        --file Containerfile \
        --build-arg BASE_IMAGE_TAG="${BASE_IMAGE_TAG}" \
        --build-arg RAKUOS_STAGING="${RAKUOS_STAGING}" \
        --skip-unused-stages=false \
        -v "$(pwd)":/run/src --security-opt=label=disable \
        --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
        --label "org.opencontainers.image.version=${BRANCH_SLUG}.${DATE_TAG}" \
        --label "org.opencontainers.image.description=${IMAGE_DESC}" \
        --label "org.opencontainers.image.source=${CI_PROJECT_URL}" \
        --label "org.opencontainers.image.revision=${CI_COMMIT_SHA}" \
        --label "org.opencontainers.image.vendor=RakuOS" \
        --label "org.opencontainers.image.keywords=${IMAGE_KEYWORDS}" \
        --label "containers.bootc=1" \
        --tag "${TEMP_TAG}" \
        .

    - |
      if [ "${CI_PIPELINE_SOURCE}" != "merge_request_event" ]; then
        buildah login -u "${QUAY_USER}" -p "${QUAY_TOKEN}" quay.io
        echo "Pushing temporary image ${TEMP_TAG}..."
        buildah push --compression-format zstd:chunked "${TEMP_TAG}" "docker://${TEMP_TAG}"
      fi
  artifacts:
    reports:
      dotenv: build-base.env
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_BRANCH == "staging"'
    - if: '$CI_COMMIT_BRANCH == "rawhide"'
    - if: '$CI_COMMIT_BRANCH == "rakuosel"'

build-nvidia:
  extends: .buildah-job
  stage: build
  script:
    - |
      if [ "${CI_COMMIT_BRANCH}" = "${CI_DEFAULT_BRANCH}" ]; then
        TAGS="${IMAGE_REGISTRY_NVIDIA}:${DEFAULT_TAG} ${IMAGE_REGISTRY_NVIDIA}:${DEFAULT_TAG}.${DATE_TAG} ${IMAGE_REGISTRY_NVIDIA}:${DATE_TAG}"
      else
        TAGS="${IMAGE_REGISTRY_NVIDIA}:${BRANCH_SLUG} ${IMAGE_REGISTRY_NVIDIA}:${BRANCH_SLUG}.${DATE_TAG}"
      fi
