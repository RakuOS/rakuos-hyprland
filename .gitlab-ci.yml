sign-image-standard:
  stage: sign
  image: quay.io/buildah/stable:latest
  tags:
    - saas-linux-2xlarge-amd64
  needs:
    - job: push-tags-base
      artifacts: false
  script:
    - |
      set -euo pipefail
      curl -fsSL "https://github.com/sigstore/cosign/releases/download/v1.0.0/cosign-linux-amd64" \
        -o /usr/local/bin/cosign
      chmod +x /usr/local/bin/cosign
      dnf install -y --quiet jq podman
      podman login --authfile ~/.docker/config.json \
        -u "${QUAY_USER}" -p "${QUAY_TOKEN}" quay.io
      case "${CI_COMMIT_BRANCH}" in
        "${CI_DEFAULT_BRANCH}") PRIMARY_TAG_NAME="${DEFAULT_TAG}" ;;
        "staging")              PRIMARY_TAG_NAME="staging"        ;;
        "rawhide")              PRIMARY_TAG_NAME="rawhide"        ;;
        "rakuosel")             PRIMARY_TAG_NAME="rakuosel"       ;;
        *) PRIMARY_TAG_NAME="$(printf '%s' "${CI_COMMIT_BRANCH}" | tr '[:upper:]' '[:lower:]' | sed 's#[^a-z0-9._-]#-#g')" ;;
      esac
      COSIGN_KEY_ID=$(curl --silent \
          --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/secure_files" \
          | jq -r '.[] | select(.name == "cosign.key") | .id')
      curl --silent \
          --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          -o /tmp/cosign.key \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/secure_files/${COSIGN_KEY_ID}/download"
      chmod 600 /tmp/cosign.key
      echo "Signing ${IMAGE_REGISTRY_QUAY}:${PRIMARY_TAG_NAME}..."
      COSIGN_PASSWORD="${COSIGN_PASSWORD:-}" cosign sign \
        -key /tmp/cosign.key \
        -a "repo=${CI_PROJECT_URL}" \
        -a "branch=${CI_COMMIT_BRANCH}" \
        "${IMAGE_REGISTRY_QUAY}:${PRIMARY_TAG_NAME}"
      rm -f /tmp/cosign.key
      echo "Image signed successfully."
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_BRANCH == "staging"'
    - if: '$CI_COMMIT_BRANCH == "rawhide"'
    - if: '$CI_COMMIT_BRANCH == "rakuosel"'

