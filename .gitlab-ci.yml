        -H "Authorization: Bearer ${QUAY_API_TOKEN}" \
        "https://quay.io/api/v1/repository/${IMAGE_REGISTRY_QUAY_NVIDIA_V3#quay.io/}/tag/${TEMP_TAG_NAME}" || true
