cleanup-temp-tags:
  stage: cleanup
  image: quay.io/buildah/stable:latest
  tags:
    - saas-linux-2xlarge-amd64
  when: always
  script:
    - |
      set -euo pipefail
      echo "Deleting Quay temp tags for pipeline ${CI_PIPELINE_ID}..."
      TEMP_TAG_NAME="ci-temp-${CI_PIPELINE_ID}"
      curl -sf -X DELETE \
        -H "Authorization: Bearer ${QUAY_API_TOKEN}" \
        "https://quay.io/api/v1/repository/${IMAGE_REGISTRY_QUAY#quay.io/}/tag/${TEMP_TAG_NAME}" || true
      curl -sf -X DELETE \
        -H "Authorization: Bearer ${QUAY_API_TOKEN}" \
        "https://quay.io/api/v1/repository/${IMAGE_REGISTRY_QUAY_NVIDIA#quay.io/}/tag/${TEMP_TAG_NAME}" || true
      curl -sf -X DELETE \
        -H "Authorization: Bearer ${QUAY_API_TOKEN}" \
        "https://quay.io/api/v1/repository/${IMAGE_REGISTRY_QUAY_V4#quay.io/}/tag/${TEMP_TAG_NAME}" || true
      curl -sf -X DELETE \
        -H "Authorization: Bearer ${QUAY_API_TOKEN}" \
        "https://quay.io/api/v1/repository/${IMAGE_REGISTRY_QUAY_NVIDIA_V4#quay.io/}/tag/${TEMP_TAG_NAME}" || true
