# ============================================================
# RakuOS Hyprland Image — GitHub Actions
# ============================================================
# GitLab (gitlab.com/rakuos/images/rakuos-hyprland) is the source of truth and
# push-mirrors every branch here. Builds start by hand (Actions › "Build
# hyprland images" › Run workflow, pick the branch in "Use workflow from") or
# from the upstream image's workflow. Pushes from the mirror never start a
# build.
#
# Same images, tags and signatures as the GitLab pipeline: 9 images,
# each pushed to quay.io and signed. They build FROM the base images
# of the same branch, which must be built first. Variants whose Containerfile
# doesn't exist on the chosen branch are skipped. No RPM database test jobs:
# GitHub's runners never corrupted the rpm database.
#
# Generated from one template for all image repos; keep them in step.
#
# Secrets (org level):
#   QUAY_USER, QUAY_TOKEN       quay.io robot login
#   QUAY_API_TOKEN              quay.io API token (tag aliases)
#   GITLAB_SECURE_FILES_TOKEN   GitLab project access token on rakuos-base
#                               (read_api, Developer): cosign.key
#   COSIGN_PASSWORD             optional: password of cosign.key (the
#                               GitLab pipeline has none set either)
#   WEBSITE_CI_API_TOKEN, WEBSITE_HOST       rakuos.org image-update notice

name: Build hyprland images

on:
  workflow_dispatch:
    inputs:
      fedora_version:
        description: "Fedora version label override (empty = the branch's default)"
        required: false
        default: ""

concurrency:
  group: build-${{ github.ref_name }}
  cancel-in-progress: false

env:
  SOURCE_URL: "https://gitlab.com/rakuos/images/rakuos-hyprland"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "hyprland", containerfile: "Containerfile", repo: "quay.io/rakuos/rakuos-hyprland", base_repo: "", extra: "", desc: "" }
          - { name: "hyprland-v4", containerfile: "Containerfile", repo: "quay.io/rakuos/rakuos-hyprland-v4", base_repo: "quay.io/rakuos/rakuos-base-v4", extra: "", desc: "" }
          - { name: "hyprland-v3", containerfile: "Containerfile", repo: "quay.io/rakuos/rakuos-hyprland-v3", base_repo: "quay.io/rakuos/rakuos-base-v3", extra: "", desc: "" }
          - { name: "hyprland-nvidia", containerfile: "Containerfile.nvidia", repo: "quay.io/rakuos/rakuos-hyprland-nvidia", base_repo: "", extra: "", desc: " (NVIDIA)" }
          - { name: "hyprland-nvidia-v4", containerfile: "Containerfile.nvidia", repo: "quay.io/rakuos/rakuos-hyprland-nvidia-v4", base_repo: "quay.io/rakuos/rakuos-base-nvidia-v4", extra: "", desc: " (NVIDIA)" }
          - { name: "hyprland-nvidia-v3", containerfile: "Containerfile.nvidia", repo: "quay.io/rakuos/rakuos-hyprland-nvidia-v3", base_repo: "quay.io/rakuos/rakuos-base-nvidia-v3", extra: "", desc: " (NVIDIA)" }
          - { name: "hyprland-nvidia-legacy", containerfile: "Containerfile.nvidia", repo: "quay.io/rakuos/rakuos-hyprland-nvidia-legacy", base_repo: "quay.io/rakuos/rakuos-base-nvidia-legacy", extra: "", desc: " (NVIDIA legacy, 580xx)" }
          - { name: "hyprland-nvidia-legacy-v4", containerfile: "Containerfile.nvidia", repo: "quay.io/rakuos/rakuos-hyprland-nvidia-legacy-v4", base_repo: "quay.io/rakuos/rakuos-base-nvidia-legacy-v4", extra: "", desc: " (NVIDIA legacy, 580xx)" }
          - { name: "hyprland-nvidia-legacy-v3", containerfile: "Containerfile.nvidia", repo: "quay.io/rakuos/rakuos-hyprland-nvidia-legacy-v3", base_repo: "quay.io/rakuos/rakuos-base-nvidia-legacy-v3", extra: "", desc: " (NVIDIA legacy, 580xx)" }
    steps:
      - uses: actions/checkout@v6

      - name: Check variant exists on this branch
        id: exists
        run: |
          if [ -f "${{ matrix.containerfile }}" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::${{ matrix.containerfile }} isn't on ${{ github.ref_name }}, skipping ${{ matrix.name }}"
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Free disk space
        if: steps.exists.outputs.build == 'true'
        uses: ublue-os/remove-unwanted-software@v9

      - name: Build, push and sign
        if: steps.exists.outputs.build == 'true'
        env:
          CONTAINERFILE: ${{ matrix.containerfile }}
          QUAY_REPO: ${{ matrix.repo }}
          DESC_SUFFIX: ${{ matrix.desc }}
          KIND: derived
          BASE_REPO: ${{ matrix.base_repo }}
          EXTRA_BUILD_ARGS: ${{ matrix.extra }}
          QUAY_USER: ${{ secrets.QUAY_USER }}
          QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}
          QUAY_API_TOKEN: ${{ secrets.QUAY_API_TOKEN }}
          GITLAB_SECURE_FILES_TOKEN: ${{ secrets.GITLAB_SECURE_FILES_TOKEN }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          FEDORA_VERSION_OVERRIDE: ${{ inputs.fedora_version }}
        run: .github/scripts/run-build.sh

  notify-website:
    name: notify rakuos.org
    needs: [build]
    if: ${{ success() && (github.ref_name == 'main' || github.ref_name == 'staging' || github.ref_name == 'rakuosel') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Post image update
        env:
          WEBSITE_CI_API_TOKEN: ${{ secrets.WEBSITE_CI_API_TOKEN }}
          WEBSITE_HOST: ${{ secrets.WEBSITE_HOST }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          DATE_TAG="$(date -u +%Y%m%d)"
          case "${BRANCH}" in
            main)     CHANNEL="main";    PRIMARY_TAG_NAME="latest" ;;
            staging)  CHANNEL="staging"; PRIMARY_TAG_NAME="staging" ;;
            rakuosel) CHANNEL="main";    PRIMARY_TAG_NAME="rakuosel" ;;
          esac
          PAYLOAD="{\"channel\": \"${CHANNEL}\", \"name\": \"rakuos-hyprland\", \"version\": \"${PRIMARY_TAG_NAME}.${DATE_TAG}\"}"
          curl -sS -f -X POST -H "Authorization: Bearer ${WEBSITE_CI_API_TOKEN}" \
            -H "Content-Type: application/json" -d "${PAYLOAD}" \
            "http://${WEBSITE_HOST}:8080/api/image-update"
