# Turn off 802.11 power save. Safe on every machine: the worst case is slightly
# higher wifi power draw. Nothing here can break connectivity.
#
# Why it is off by default: some MediaTek MT7921 firmware hangs on power-state
# transitions and teardown -- "driver own failed", "Timeout for driver own",
# "Message ... timeout", "chip reset failed" -- which drops wifi and can stall
# shutdown. Disabling power save is the standard mitigation. Other chipsets do
# not need it, which is the only reason this is a shared file rather than an
# MT7921-specific one.
#
# Scope, and the reason you may still see powersave enabled on a profile that
# predates this file: this sets a *default* for new connection profiles. It does
# not rewrite existing ones. To apply it to a profile that is already saved:
#
#     nmcli con mod "<name>" wifi.powersave 2
#
# Note the key is wifi.powersave, NOT 802-11-wireless.powersave. nmcli lists the
# latter in "nmcli con show" output but it is read-only there and "con mod" will
# reject it; wifi.powersave is the writable one.
#
# Verified on NetworkManager 1.56.1: values are 0=use-default, 1=enable,
# 2=disable, 3=ignore.
[connection]
wifi.powersave = 2
