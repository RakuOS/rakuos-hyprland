# greetd configuration for Noctalia Greeter.
#
# Matches the generator shipped in noctalia-greeter (regenerate with
# noctalia-greeter-print-greetd-config).
#
# The command is noctalia-greeter-session, not noctalia-greeter: the session
# wrapper starts the bundled wlroots compositor and runs the greeter inside it.
# Pointing greetd straight at noctalia-greeter leaves nothing running the
# compositor and you get a black VT.

[terminal]
vt = 1

[default_session]
command = "/usr/bin/noctalia-greeter-session"
user = "greeter"

# Desktop session is not pinned here: the Hyprland entry
# (/usr/share/wayland-sessions/hyprland-uwsm.desktop) is generated by
# post-build.sh at build time, so greetd discovers it via wayland-sessions.
# To pin: command = "/usr/bin/noctalia-greeter-session -- --session <name>"